version: "3.8"

services:
  app:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    container_name: auction-app
    ports:
      - "8080:8080"
    environment:
      - AUCTION_CONFIG=/app/configs/config.yaml
    volumes:
      - ../configs:/app/configs:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - auction-net
    # Docker 只支持单一 healthcheck，等价于 K8s liveness。
    # K8s 三探针映射：
    #   startupProbe  -> GET /startup
    #   livenessProbe -> GET /health
    #   readinessProbe -> GET /ready
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mysql:
    image: mysql:8.0
    container_name: auction-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: auction
      MYSQL_USER: auction
      MYSQL_PASSWORD: auction123
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./migrations/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - auction-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "auction", "-pauction123"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: auction-redis
    command: redis-server --appendonly yes --notify-keyspace-events Ex
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - auction-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  auction-net:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
