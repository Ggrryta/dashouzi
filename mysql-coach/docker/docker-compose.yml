version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: coach-postgres
    environment:
      POSTGRES_USER: coach
      POSTGRES_PASSWORD: coach123
      POSTGRES_DB: mysql_coach
    ports:
      - "5432:5432"
    volumes:
      - coach_pg_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coach -d mysql_coach"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: coach-backend
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=coach
      - DB_PASSWORD=coach123
      - DB_NAME=mysql_coach
      - DB_SSLMODE=disable
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.openai.com/v1}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-3-small}
      - EMBEDDING_DIM=${EMBEDDING_DIM:-1536}
      - SERVER_PORT=8080
      - GIN_MODE=debug
      - FRONTEND_URL=http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../backend:/app
    command: go run cmd/server/main.go

  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: coach-frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ../frontend:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev

volumes:
  coach_pg_data:
